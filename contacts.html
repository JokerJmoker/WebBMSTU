<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <link href="style.css" rel="stylesheet">
    <title>Контакты — МГТУ им. Н.Э. Баумана</title>
</head>

<body>

<header>
    <div class="logo">
        <img
            class="logo__image"
            src="img/logo_with_text.png"
            alt="Логотип МГТУ"
            width="275"
            height="70"
        >
    </div>

    <div class="navigation">
        <ul class="navigation__list">
            <li class="navigation__list-item">
                <a class="navigation__link" href="index.html">
                    Главная страница
                </a>
            </li>

            <li class="navigation__list-item">
                <a class="navigation__link" href="contacts.html">
                    Контакты
                </a>
            </li>
        </ul>
    </div>
</header>

<main>

    <div class="contacts__wrapper">

        <div class="contacts__header">
            <h1>Связаться с нами</h1>
        </div>

        <form class="contacts__form" action="/submit_form.php" method="post">

            <label class="contacts__form-label" for="username">
                Как вас зовут?
            </label>

            <input
                class="contacts__form-input"
                type="text"
                id="username"
                name="username"
            >

            <br><br>

            <label class="contacts__form-label" for="message">
                Сообщение
            </label>

            <textarea
                class="contacts__form-textarea"
                rows="5"
                name="message"
                id="message"
                placeholder="Расскажите обо всём, что для вас важно"
            ></textarea>

            <br><br>

            <input
                class="contacts__form-submit"
                type="submit"
                value="Отправить"
            >
            <p class="welcome-user"></p>
        </form>
    </div>
</main>

<footer>
    Подвал сайта.
</footer>

<!--<script src="script.js"></script>-->
<script src="xss-test.js"></script>

</body>
</html>
